# Publishes every package whose version is not on npm yet, with provenance.
# Uses npm trusted publishing (OIDC), so no npm token is stored. Each package lists this
# repository, this workflow file and the "npm" environment as its trusted publisher on npmjs.com.
name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # pnpm packs each package, turning workspace:* into real versions; npm publishes the
      # tarball through trusted publishing. Versions already on npm are skipped.
      - name: Publish new versions
        run: |
          packs="$RUNNER_TEMP/packs"
          mkdir -p "$packs"
          for dir in packages/core packages/testkit packages/*/; do
            dir="${dir%/}"
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            [ -f "$packs/.$(echo "$name" | tr / -)" ] && continue
            touch "$packs/.$(echo "$name" | tr / -)"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            (cd "$dir" && pnpm pack --pack-destination "$packs" > /dev/null)
            tarball="$packs/$(echo "${name#@}" | tr / -)-$version.tgz"
            npm publish "$tarball" --access public --provenance
          done
