# Publishes every package whose version is not on npm yet, with provenance.
# Uses npm trusted publishing (OIDC), so no npm token is stored. Each package must list this
# repository and workflow as a trusted publisher on npmjs.com (package → Settings).
name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Publish new versions
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: pnpm -r publish --no-git-checks --access public
