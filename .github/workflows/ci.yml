name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  image:
    name: server image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t anbiq:ci .
      - name: Refuses to start without configuration
        run: |
          set +e
          output=$(docker run --rm anbiq:ci 2>&1)
          code=$?
          echo "$output"
          [ "$code" -eq 1 ] && echo "$output" | grep -q "Anbiq cannot start"

  ci:
    name: ci
    if: always()
    needs: [test, image]
    runs-on: ubuntu-latest
    env:
      TEST: ${{ needs.test.result }}
      IMAGE: ${{ needs.image.result }}
    steps:
      - name: All checks passed
        run: test "$TEST" = "success" && test "$IMAGE" = "success"
