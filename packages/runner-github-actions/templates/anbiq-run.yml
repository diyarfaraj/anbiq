# Anbiq crew run. Copy this file to .github/workflows/anbiq-run.yml in the repository the factory works on.
#
# Two jobs, on purpose:
#   crew     runs the agent with a read-only GITHUB_TOKEN and no factory secrets. Its commits leave the job
#            only as a git bundle artifact.
#   publish  has write access and the callback secret, but runs no agent: it pushes the bundle to the job's
#            branch and reports the result to the factory.
#
# Values from inputs and from the agent are only ever passed through environment variables, never
# interpolated into shell scripts.

name: anbiq run
run-name: anbiq ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Anbiq run ID
        required: true
        type: string
      job_id:
        description: Anbiq job ID
        required: true
        type: string
      stage:
        description: Crew stage
        required: true
        type: choice
        options: [spec, build, qa, review]
      branch:
        description: The job branch
        required: true
        type: string
      invocation:
        description: Base64 JSON prepared by the agent engine
        required: true
        type: string

permissions: {}

concurrency:
  group: anbiq-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  crew:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      RUN_ID: ${{ inputs.run_id }}
      BRANCH: ${{ inputs.branch }}
      INVOCATION: ${{ inputs.invocation }}
    steps:
      - name: Check the inputs
        id: inputs
        run: |
          [[ "$RUN_ID" =~ ^[A-Za-z0-9-]{1,64}$ ]] || { echo "::error::invalid run ID"; exit 1; }
          [[ "$BRANCH" =~ ^anbiq/[a-z0-9]{1,40}$ ]] || { echo "::error::refusing branch $BRANCH"; exit 1; }
          printf '%s' "$INVOCATION" | base64 -d > "$RUNNER_TEMP/invocation.json"
          jq -e '(.engine | type == "string") and (.prompt | type == "string") and (.settings | type == "object") and (.maxTurns | type == "number")' \
            "$RUNNER_TEMP/invocation.json" > /dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the job branch
        id: prepare
        env:
          # Read-only, and used for these two git commands only: it is never written to the git
          # config, so the agent's git has no credentials.
          READ_TOKEN: ${{ github.token }}
        run: |
          git config user.name "anbiq"
          git config user.email "anbiq@users.noreply.github.com"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$READ_TOKEN" | base64 -w0)"
          status=0
          git -c "http.extraheader=$auth" ls-remote --exit-code --heads origin "$BRANCH" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git -c "http.extraheader=$auth" fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          elif [ "$status" -eq 2 ]; then
            # No such branch yet: this is the job's first run.
            git checkout -b "$BRANCH"
          else
            echo "::error::could not read the job branch from the repository"
            exit 1
          fi
          echo "start=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p .anbiq
          echo ".anbiq/" >> .git/info/exclude

          inv="$RUNNER_TEMP/invocation.json"
          delimiter="ANBIQ_$(openssl rand -hex 16)"
          {
            echo "prompt<<$delimiter"
            jq -r '.prompt' "$inv"
            echo "$delimiter"
            echo "engine=$(jq -r '.engine | select(test("^[a-z0-9-]{1,40}$"))' "$inv")"
            echo "settings=$(jq -c '.settings' "$inv")"
            echo "model=$(jq -r '.model // ""' "$inv")"
            echo "args=--max-turns $(jq -r '.maxTurns' "$inv")$(jq -r 'if .model then " --model " + .model else "" end' "$inv")"
            echo "timeout=$(jq -r '.timeoutMinutes // 60' "$inv")"
          } >> "$GITHUB_OUTPUT"

      # One step per agent engine. `engine.id` in anbiq.yml decides which one runs; each brings its
      # own agent and its own secret. `settings` is that agent's configuration, with the crew's
      # permissions, as the factory prepared it.
      - name: Refuse an engine this workflow has no step for
        if: ${{ !contains(fromJSON('["claude-code","opencode"]'), steps.prepare.outputs.engine) }}
        run: |
          echo "::error::this workflow has no step for the configured agent engine"
          exit 1

      - name: Run the crew (claude-code)
        id: claude-code
        if: steps.prepare.outputs.engine == 'claude-code'
        uses: anthropics/claude-code-action@v1
        timeout-minutes: ${{ fromJSON(steps.prepare.outputs.timeout) }}
        with:
          # Crews run on a Claude subscription when CLAUDE_CODE_OAUTH_TOKEN is set (from
          # `claude setup-token`), and on the API key otherwise. Only one is ever passed on.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          # The factory dispatches this workflow as a GitHub App, which the action treats as a bot and
          # refuses by default. Allowing bots is safe here: workflow_dispatch is the only trigger, and
          # only an actor with write access to this repository can dispatch it.
          allowed_bots: '*'
          prompt: ${{ steps.prepare.outputs.prompt }}
          settings: ${{ steps.prepare.outputs.settings }}
          claude_args: ${{ steps.prepare.outputs.args }}

      # OpenCode runs the crew on the provider named in the model ("provider/model"). Only the keys
      # that are set as secrets reach it. The rules in `settings` are the only config it loads:
      # config, agents and plugins inside the repository are switched off, so the repository cannot
      # widen the crew's permissions.
      - name: Run the crew (opencode)
        id: opencode
        if: steps.prepare.outputs.engine == 'opencode'
        timeout-minutes: ${{ fromJSON(steps.prepare.outputs.timeout) }}
        env:
          PROMPT: ${{ steps.prepare.outputs.prompt }}
          SETTINGS: ${{ steps.prepare.outputs.settings }}
          MODEL: ${{ steps.prepare.outputs.model }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENCODE_DISABLE_PROJECT_CONFIG: '1'
          OPENCODE_DISABLE_AUTOUPDATE: '1'
        run: |
          [ -n "$MODEL" ] || { echo "::error::the opencode engine needs engine.model in anbiq.yml"; exit 1; }
          # An unset secret arrives as an empty variable, which must not count as a key.
          for key in OPENAI_API_KEY GEMINI_API_KEY OPENROUTER_API_KEY ANTHROPIC_API_KEY GROQ_API_KEY \
            MISTRAL_API_KEY DEEPSEEK_API_KEY XAI_API_KEY; do
            [ -n "${!key}" ] || unset "$key"
          done
          # The version the permission rules were checked against. Change it together with
          # OPENCODE_VERSION in @anbiq/engine-opencode.
          npm install --global --no-fund --no-audit @opencode/cli@2.4.1
          printf '%s' "$SETTINGS" > "$RUNNER_TEMP/opencode.json"
          export OPENCODE_CONFIG="$RUNNER_TEMP/opencode.json"
          # Without --auto, a permission the rules do not settle is refused. Standard input is
          # closed because the agent otherwise waits on it.
          opencode run --standalone --format json --model "$MODEL" "$PROMPT" \
            < /dev/null > "$RUNNER_TEMP/opencode.jsonl"

      - name: Package the result
        if: always()
        env:
          START: ${{ steps.prepare.outputs.start }}
          STAGE: ${{ inputs.stage }}
          EXECUTION_FILE: ${{ steps.claude-code.outputs.execution_file }}
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          if [ -f .anbiq/result.json ] && jq -e '.outcome and .summary' .anbiq/result.json > /dev/null 2>&1; then
            cp .anbiq/result.json "$out/result.json"
          else
            echo '{"outcome":"failed","summary":"The crew finished without reporting a result."}' > "$out/result.json"
          fi
          # Null when the agent does not report what it cost: the factory then counts jobs only.
          cost=null
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            cost=$(jq '[.[]? | select(.type == "result") | .total_cost_usd // 0] | add // 0' "$EXECUTION_FILE" 2> /dev/null || echo null)
          elif [ -f "$RUNNER_TEMP/opencode.jsonl" ]; then
            cost=$(jq -s '[.[] | select(.type == "step_finish") | .part.cost // 0] | add // 0' "$RUNNER_TEMP/opencode.jsonl" 2> /dev/null || echo null)
          fi
          # A build or QA crew that passed but left changes uncommitted, for example because the
          # agent refused its commit command, still did the work. Commit it rather than lose it.
          if { [ "$STAGE" = build ] || [ "$STAGE" = qa ]; } && [ "$(jq -r '.outcome' "$out/result.json")" = passed ] \
            && [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c core.hooksPath=/dev/null commit --quiet -m "Save the $STAGE crew's uncommitted work"
          fi
          head=$(git rev-parse HEAD)
          jq -n --arg start "${START:-}" --arg head "$head" --argjson cost "${cost:-null}" \
            '{start: $start, head: $head, costUsd: $cost}' > "$out/meta.json"
          if [ -n "$START" ] && [ "$head" != "$START" ] && [ -n "$(git diff --name-only "$START" "$head" -- .github/workflows)" ]; then
            # Whatever the agent's own rules let through, a crew never changes CI.
            echo '{"outcome":"failed","summary":"The crew changed CI workflows, which no crew may do. Its commits were discarded."}' > "$out/result.json"
          elif [ -n "$START" ] && [ "$head" != "$START" ]; then
            git branch -f anbiq-crew HEAD
            git bundle create "$out/crew.bundle" anbiq-crew "^$START"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anbiq-${{ inputs.run_id }}
          path: ${{ runner.temp }}/out
          retention-days: 3

  publish:
    needs: crew
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RUN_ID: ${{ inputs.run_id }}
      JOB_ID: ${{ inputs.job_id }}
      STAGE: ${{ inputs.stage }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: anbiq-${{ inputs.run_id }}
          path: ${{ runner.temp }}/crew

      - name: Push the crew's commits
        id: push
        run: |
          [[ "$BRANCH" =~ ^anbiq/[a-z0-9]{1,40}$ ]] || { echo "::error::refusing branch $BRANCH"; exit 1; }
          crew="$RUNNER_TEMP/crew"
          head=""
          if [ -f "$crew/crew.bundle" ]; then
            git fetch "$crew/crew.bundle" "anbiq-crew:refs/anbiq/crew"
            git push origin "refs/anbiq/crew:refs/heads/$BRANCH"
            head=$(git rev-parse refs/anbiq/crew)
          elif [ -f "$crew/meta.json" ]; then
            head=$(jq -r '.head // empty' "$crew/meta.json")
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Report to the factory
        if: always()
        env:
          HEAD_SHA: ${{ steps.push.outputs.head }}
          CALLBACK_URL: ${{ vars.ANBIQ_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.ANBIQ_CALLBACK_SECRET }}
        run: |
          crew="$RUNNER_TEMP/crew"
          result="$crew/result.json"
          [ -f "$result" ] || echo '{"outcome":"failed","summary":"The crew job did not finish."}' > "$result"
          cost=$(jq '.costUsd' "$crew/meta.json" 2> /dev/null || echo null)
          body=$(jq -c \
            --arg runId "$RUN_ID" --arg jobId "$JOB_ID" --arg stage "$STAGE" \
            --arg headSha "$HEAD_SHA" --argjson cost "${cost:-null}" \
            '{runId: $runId, jobId: $jobId, stage: $stage, outcome: .outcome, summary: .summary,
              question: .question, headSha: (if $headSha == "" then null else $headSha end), costUsd: $cost}' \
            "$result")
          timestamp=$(date +%s)
          signature=$(printf '%s.%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | awk '{print $NF}')
          curl --fail --silent --show-error --max-time 30 \
            -X POST "$CALLBACK_URL/runs/$RUN_ID" \
            -H "content-type: application/json" \
            -H "x-anbiq-timestamp: $timestamp" \
            -H "x-anbiq-signature: sha256=$signature" \
            --data "$body"
